apiVersion: apps/v1
kind: Deployment

metadata:
  name: k8s-demo

spec:
  replicas: 3

  selector:
    matchLabels:
      app: k8s-demo

  template:
    metadata:
      labels:
        app: k8s-demo

    spec:
      containers:
        - name: k8s-demo
          image: k8s-demo:v6
          ports:
            - containerPort: 8080
#          env:
#            - name: APP_MESSAGE
#              valueFrom:
#                configMapKeyRef:
#                  name: k8s-demo-config
#                  key: APP_MESSAGE
#
#            - name: APP_VERSION
#              valueFrom:
#                configMapKeyRef:
#                  name: k8s-demo-config
#                  key: APP_VERSION
          envFrom:
            - configMapRef:
                name: k8s-demo-config
            - secretRef:
                name: k8s-demo-secret